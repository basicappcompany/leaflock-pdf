name: IndexNow after deploy

# Tells Bing and the other IndexNow engines about the sitemap URLs once a push to main is live.
# Cloudflare Pages deploys on its own git integration, so this workflow cannot know when the new
# pages are up by itself: it waits for the "Cloudflare Pages" check Cloudflare posts on the commit,
# then runs scripts/indexnow.mjs (which also refuses to send unless the key file and the sitemap are live).
# A push that only touches docs, tests or workflows is skipped, so engines are not told about pages
# that did not change. Run it by hand from the Actions tab (workflow_dispatch) to ping regardless.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One ping at a time; a newer push waits rather than cancelling a ping already sent.
concurrency:
  group: indexnow
  cancel-in-progress: false

permissions:
  contents: read
  checks: read # to read the Cloudflare Pages check run on the commit

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # to compare the pushed commit with the one before it

      - uses: actions/setup-node@v7
        with:
          node-version: '24' # scripts/indexnow.mjs needs only Node's built-in fetch, no install

      - name: Skip pushes that changed no page
        id: scope
        if: github.event_name == 'push'
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD)
          echo "$changed"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^(docs/|tests/|\.github/|CLAUDE\.md$|README)'; then
            echo "Only docs, tests or workflows changed: nothing to ping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the Cloudflare Pages deploy of this commit
        id: deploy
        if: github.event_name == 'workflow_dispatch' || steps.scope.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            state=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '[.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages")][0] | "\(.status // "none") \(.conclusion // "none")"')
            echo "attempt $i: Cloudflare Pages check is: ${state:-none none}"
            case "$state" in
              "completed success") echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              "completed "*) echo "::warning::The Cloudflare Pages deploy did not succeed ($state); not pinging."; exit 0 ;;
            esac
            sleep 20
          done
          echo "::warning::The Cloudflare Pages deploy did not finish within 30 minutes; not pinging."

      - name: Ping IndexNow
        if: steps.deploy.outputs.ready == 'true'
        run: node scripts/indexnow.mjs
