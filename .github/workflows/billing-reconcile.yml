name: Billing reconcile

# Dodo Payments is the source of truth for who has paid; our database is a copy kept in step by webhooks.
# Dodo gives up on a webhook after eight attempts (about 27 hours), so every few hours this asks
# /api/billing/reconcile to re-read the paid accounts it has not checked lately and repair any that
# disagree. The job fails when the call fails or any account could not be read, so a drift or an outage
# shows up as a red run instead of a silent gap. Run it by hand from the Actions tab to check now.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: billing-reconcile
  cancel-in-progress: false

permissions: {}

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Re-read paid accounts from Dodo
        env:
          RECONCILE_TOKEN: ${{ secrets.RECONCILE_TOKEN }}
        run: |
          if [ -z "$RECONCILE_TOKEN" ]; then
            echo "::notice::RECONCILE_TOKEN is not set in this repository's secrets; nothing to do (docs/TODO.md section 3)."
            exit 0
          fi
          # A named User-Agent: Cloudflare's bot rules answered an unnamed one with a 403 on /sitemap.xml.
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RECONCILE_TOKEN" \
            -A 'leaflock-billing-reconcile/1.0 (+github-actions)' \
            https://leaflockpdf.com/api/billing/reconcile)
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::The reconcile endpoint answered $status."
            exit 1
          fi
          errors=$(node -e "console.log(JSON.parse(require('fs').readFileSync('response.json','utf8')).errors)")
          if [ "$errors" != "0" ]; then
            echo "::error::$errors account(s) could not be read from Dodo."
            exit 1
          fi
